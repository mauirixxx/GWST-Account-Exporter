name: Build GWST Account Exporter

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/**
      - fix/**
    paths:
      - plugin/**
      - .github/workflows/build-gwtoolbox-plugin.yml
      - .github/pins.env

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Load upstream pins
        shell: bash
        run: grep -E '^[A-Z0-9_]+=' .github/pins.env >> "$GITHUB_ENV"

      - name: Checkout GWToolboxpp
        shell: bash
        run: |
          git clone --filter=blob:none --no-checkout https://github.com/gwdevhub/GWToolboxpp.git GWToolboxpp
          cd GWToolboxpp
          git checkout "$GWTOOLBOX_COMMIT"

      - name: Inject plugin
        shell: pwsh
        run: |
          Copy-Item -Recurse plugin/AccountExport GWToolboxpp/plugins/AccountExport
          Add-Content GWToolboxpp/cmake/gwtoolboxdll_plugins.cmake "`nadd_tb_plugin(AccountExport)"

      - name: Install vcpkg
        shell: bash
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          git checkout "$VCPKG_COMMIT"
          ./bootstrap-vcpkg.bat

      - name: Set VCPKG_ROOT
        shell: powershell
        run: echo "VCPKG_ROOT=${{ github.workspace }}\\vcpkg" >> $env:GITHUB_ENV

      - name: Configure CMake
        shell: bash
        working-directory: GWToolboxpp
        run: cmake . --preset=vcpkg

      - name: Build AccountExport
        shell: bash
        working-directory: GWToolboxpp
        run: cmake --build build --config RelWithDebInfo --target AccountExport

      - name: Collect artifact as TitlesExport.dll
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          $dll = Get-ChildItem -Recurse GWToolboxpp/bin -Filter AccountExport.dll | Select-Object -First 1
          if (-not $dll) { throw "AccountExport.dll was not produced" }
          Copy-Item $dll.FullName out/TitlesExport.dll
          $pdb = Get-ChildItem -Recurse GWToolboxpp/bin -Filter AccountExport.pdb | Select-Object -First 1
          if ($pdb) { Copy-Item $pdb.FullName out/TitlesExport.pdb }
          Get-ChildItem out

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: TitlesExport
          path: out/
          if-no-files-found: error
